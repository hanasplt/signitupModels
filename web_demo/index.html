<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>FSL Stable Inference (A-Z, 1-20)</title>
    <style>
        body { margin:0; background:#111; color:#0f0; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
        #wrap { position:relative; width:640px; height:480px; margin-top: 20px; border: 3px solid #333; border-radius: 10px; overflow: hidden; }
        video, canvas { position:absolute; top:0; left:0; transform:scaleX(-1); }
        .ui-panel { width: 640px; background: #222; padding: 15px; border-radius: 0 0 10px 10px; border: 1px solid #333; text-align: center; }
        #pred { font-size: 2.8em; font-weight: bold; color: #0f0; text-shadow: 0 0 10px #0f0; margin: 5px 0; }
        #conf { color: #ff0; font-size: 1.2em; font-family: monospace; }
        #status { color: #888; font-size: 0.9em; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; height: 1.2em; }
        .recording { color: #f00 !important; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>

<body>
    <h2>FSL Dynamic Gesture Recognition</h2>

    <div id="wrap">
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <div class="ui-panel">
        <div id="pred">INITIALIZING...</div>
        <div id="conf">CONF: 0.00</div>
        <div id="status">Loading Assets...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>

    <script>
        /* ================= KALMAN FILTER LOGIC ================= */
        class KalmanFilter {
            constructor(R = 0.008, Q = 0.0001) { 
                this.R = R; this.Q = Q; this.x = 0; this.p = 1; this.k = 0; this.firstRun = true;
            }
            update(m) {
                if (this.firstRun) { this.x = m; this.firstRun = false; }
                this.p += this.Q;
                this.k = this.p / (this.p + this.R);
                this.x += this.k * (m - this.x);
                this.p *= (1 - this.k);
                return this.x;
            }
        }

        const coordinateFilters = Array.from({ length: 42 }, () => new KalmanFilter());

        /* ================= CONFIG ================= */
        const SEQ_LEN = 50;
        const VECTOR_LEN = 89;
        const CONF_THRESHOLD = 0.45;
        const COOLDOWN_FRAMES = 5;        
        const START_MOTION_THRESHOLD = 0.003; 
        const STOP_MOTION_THRESHOLD = 0.0012; 
        const GRACE_PERIOD = 5;               
        const POST_MOTION_FRAMES = 2; // Extra frames to capture the "Final Pose"

        let session = null, inputName = null, outputName = null;
        let LABELS = [], normMean = null, normStd = null;
        let sequence = [], prevLm = null, stillFrames = 0, cooldown = 0;
        let isPostCapture = false, postCaptureCount = 0;

        /* ================= MATH UTILS ================= */
        function softmax(arr) {
            const m = Math.max(...arr);
            const ex = arr.map(v => Math.exp(v - m));
            const s = ex.reduce((a, b) => a + b, 0);
            return ex.map(v => v / s);
        }

        function computeFingerStates(p) {
            return [
                p[4*2+1]  < p[3*2+1] ? 1.0 : 0.0,
                p[8*2+1]  < p[6*2+1] ? 1.0 : 0.0,
                p[12*2+1] < p[10*2+1] ? 1.0 : 0.0,
                p[16*2+1] < p[14*2+1] ? 1.0 : 0.0,
                p[20*2+1] < p[18*2+1] ? 1.0 : 0.0
            ];
        }

        /* ================= ASSET LOADING ================= */
        async function loadAssets() {
            try {
                ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/";
                const [mRes, sRes, lRes] = await Promise.all([
                    fetch(`./norm_mean.json?v=${Date.now()}`),
                    fetch(`./norm_std.json?v=${Date.now()}`),
                    fetch(`./labels.json?v=${Date.now()}`)
                ]);
                normMean = await mRes.json();
                normStd = await sRes.json();
                LABELS = await lRes.json();
                session = await ort.InferenceSession.create("./gesture_lstm.onnx");
                inputName = session.inputNames[0];
                outputName = session.outputNames[0];
                document.getElementById("status").innerText = "Ready";
            } catch (e) { document.getElementById("status").innerText = "Error"; }
        }

        /* ================= MEDIAPIPE LOOP ================= */
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });

        hands.onResults(res => {
            ctx.clearRect(0, 0, 640, 480);
            if (!session || !normMean) return;
            if (cooldown > 0) { cooldown--; return; }

            if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) {
                sequence = []; prevLm = null; stillFrames = 0; isPostCapture = false;
                document.getElementById("status").innerText = "READY";
                return;
            }

            const hand = res.multiHandLandmarks[0];
            drawConnectors(ctx, hand, HAND_CONNECTIONS, {color: "#0f0", lineWidth: 3});
            drawLandmarks(ctx, hand, {color: "#fff", radius: 2});

            const filteredLm = [];
            for (let i = 0; i < 21; i++) {
                filteredLm.push(coordinateFilters[i*2].update(1.0 - hand[i].x));
                filteredLm.push(coordinateFilters[i*2 + 1].update(hand[i].y));
            }

            let motion = 0;
            let vel = new Array(42).fill(0);
            if (prevLm) {
                // FINGER-ONLY MOTION: Check movement of tips relative to wrist
                for (let i = 2; i < 21; i++) {
                    const dx = (filteredLm[i*2] - filteredLm[0]) - (prevLm[i*2] - prevLm[0]);
                    const dy = (filteredLm[i*2+1] - filteredLm[1]) - (prevLm[i*2+1] - prevLm[1]);
                    motion += (Math.abs(dx) + Math.abs(dy));
                }
                motion /= 19;
                vel = filteredLm.map((v, i) => v - prevLm[i]);
            }
            prevLm = [...filteredLm];

            const fstates = computeFingerStates(filteredLm);
            const semanticFrame = [...filteredLm, ...vel, ...fstates];
            const statusEl = document.getElementById("status");

            if (sequence.length === 0) {
                if (motion > START_MOTION_THRESHOLD) {
                    sequence.push(semanticFrame);
                    statusEl.innerText = "RECORDING...";
                    statusEl.className = "status recording";
                }
            } else {
                sequence.push(semanticFrame);

                if (!isPostCapture) {
                    if (motion < STOP_MOTION_THRESHOLD) {
                        stillFrames++;
                        if (stillFrames >= GRACE_PERIOD) {
                            isPostCapture = true;
                            postCaptureCount = 0;
                        }
                    } else { stillFrames = 0; }
                } else {
                    // This part captures the "Final Pose" for 14/16 distinction
                    postCaptureCount++;
                    statusEl.innerText = "HOLD POSE...";
                }

                // Final trigger
                if (postCaptureCount >= POST_MOTION_FRAMES || sequence.length >= 80) {
                    statusEl.innerText = "ANALYZING...";
                    
                    let seqArr = [...sequence];
                    const lastFrame = seqArr[seqArr.length - 1];
                    while (seqArr.length < SEQ_LEN) { seqArr.push([...lastFrame]); }
                    if (seqArr.length > SEQ_LEN) { seqArr = seqArr.slice(-SEQ_LEN); }

                    const normalized = seqArr.map(frame => 
                        frame.map((v, i) => (v - normMean[i]) / (normStd[i] + 1e-6))
                    );

                    const tensor = new ort.Tensor("float32", Float32Array.from(normalized.flat()), [1, SEQ_LEN, VECTOR_LEN]);

                    session.run({ [inputName]: tensor }).then(out => {
                        const probs = softmax(Array.from(out[outputName].data));
                        const idx = probs.indexOf(Math.max(...probs));
                        document.getElementById("pred").innerText = probs[idx] >= CONF_THRESHOLD ? LABELS[idx] : "UNCERTAIN";
                        document.getElementById("conf").innerText = `CONF: ${probs[idx].toFixed(2)}`;
                    });

                    sequence = []; stillFrames = 0; isPostCapture = false; postCaptureCount = 0;
                    cooldown = COOLDOWN_FRAMES;
                }
            }
        });

        const camera = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 640, height: 480 });
        loadAssets().then(() => camera.start());
    </script>
</body>
</html>
