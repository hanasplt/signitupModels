<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ONNX Gesture Inference (Stable)</title>

<style>
body {
  margin:0;
  background:#111;
  color:#0f0;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#wrap {
  position:relative;
  width:640px;
  height:480px;
}
video, canvas {
  position:absolute;
  top:0; left:0;
  transform:scaleX(-1);
}
#pred { font-size:1.6em; margin-top:10px }
#conf { color:#ff0 }
</style>
</head>

<body>
<h2>Browser-based Hand Gesture Inference</h2>

<div id="wrap">
  <video id="video" width="640" height="480" autoplay playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="pred">Loading model...</div>
<div id="conf"></div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<!-- ONNX Runtime -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>

<script>
/* ======================================================
   CONFIG
====================================================== */
const LABELS = ['10','11','12','13','14','15','A','HELLO','J','YES','Z'];
const SEQ_LEN = 50;
const FEATURE_LEN = 42;

const MOTION_THRESH = 0.0025;
const STILL_FRAMES = 10;
const COOLDOWN = 12;
const CONF_THRESH = 0.65;
const SMOOTH_ALPHA = 0.75;

/* ======================================================
   STATE
====================================================== */
let session = null;
let inputName = null;
let outputName = null;

let sequence = [];
let prevLm = null;
let smoothLm = null;
let stillCount = 0;
let cooldown = 0;

/* ======================================================
   UTILS
====================================================== */
function softmax(arr) {
  const m = Math.max(...arr);
  const ex = arr.map(v => Math.exp(v - m));
  const s = ex.reduce((a,b)=>a+b,0);
  return ex.map(v => v/s);
}

function normalize(seq) {
  let min = Infinity, max = -Infinity;
  seq.flat().forEach(v => {
    min = Math.min(min, v);
    max = Math.max(max, v);
  });
  return seq.map(f => f.map(v => (v - min) / (max - min + 1e-6)));
}

/* ======================================================
   LOAD ONNX
====================================================== */
async function loadModel() {
  ort.env.wasm.wasmPaths =
    "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/";

  session = await ort.InferenceSession.create("./gesture_lstm.onnx");

  inputName = session.inputNames[0];
  outputName = session.outputNames[0];

  document.getElementById("pred").innerText =
    "Model loaded – show a gesture";
}

/* ======================================================
   MEDIAPIPE
====================================================== */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const hands = new Hands({
  locateFile: f =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.4,
  minTrackingConfidence:0.4
});

/* ======================================================
   RESULTS CALLBACK
====================================================== */
hands.onResults(res => {
  ctx.clearRect(0,0,640,480);

  if (!session) return;

  if (cooldown > 0) cooldown--;

  if (!res || !res.multiHandLandmarks || res.multiHandLandmarks.length === 0) {
    prevLm = null;
    smoothLm = null;
    stillCount = 0;
    return;
  }

  const hand = res.multiHandLandmarks[0];
  drawConnectors(ctx, hand, HAND_CONNECTIONS, {color:"#0f0"});
  drawLandmarks(ctx, hand, {color:"#0f0", radius:3});

  // ===== landmarks =====
  let curr = [];
  for (let i=0;i<21;i++) {
    curr.push(hand[i].x - hand[0].x);
    curr.push(hand[i].y - hand[0].y);
  }

  // EMA smoothing
  if (!smoothLm) smoothLm = curr;
  else {
    smoothLm = smoothLm.map((v,i)=>
      SMOOTH_ALPHA*v + (1-SMOOTH_ALPHA)*curr[i]
    );
  }

  // motion
  let motion = 999;
  if (prevLm)
    motion = smoothLm.reduce((s,v,i)=>s+Math.abs(v-prevLm[i]),0)/smoothLm.length;

  prevLm = [...smoothLm];

  if (cooldown === 0) {
    if (motion > MOTION_THRESH) {
      sequence.push(smoothLm);
      stillCount = 0;
    } else {
      stillCount++;
    }
  }

  // ===== inference =====
  if (stillCount >= STILL_FRAMES && sequence.length >= 20) {

    while (sequence.length < SEQ_LEN)
      sequence.push(new Array(FEATURE_LEN).fill(0));

    sequence = normalize(sequence.slice(-SEQ_LEN));

    const tensor = new ort.Tensor(
      "float32",
      sequence.flat(),
      [1, SEQ_LEN, FEATURE_LEN]
    );

    session.run({ [inputName]: tensor }).then(out => {
      const probs = softmax(Array.from(out[outputName].data));
      const idx = probs.indexOf(Math.max(...probs));
      const conf = probs[idx];

      document.getElementById("pred").innerText =
        conf >= CONF_THRESH ? LABELS[idx] : "Uncertain";
      document.getElementById("conf").innerText =
        `Confidence: ${(conf*100).toFixed(1)}%`;
    });

    sequence = [];
    prevLm = null;
    smoothLm = null;
    stillCount = 0;
    cooldown = COOLDOWN;
  }
});

/* ======================================================
   CAMERA
====================================================== */
const camera = new Camera(video, {
  onFrame: async()=>await hands.send({image:video}),
  width:640,
  height:480
});

/* ======================================================
   START
====================================================== */
(async()=>{
  await loadModel();
  await camera.start();
})();
</script>
</body>
</html>
