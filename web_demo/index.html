<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SignItUp - Static Inference</title>
    <style>
        body { margin:0; background:#111; color:#0f0; font-family:'Courier New', monospace; display:flex; flex-direction:column; align-items:center; padding-top: 20px;}
        h2 { letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        
        #display-container { display: flex; gap: 10px; justify-content: center; transform: scaleX(-1); }
        
        .view-wrap { 
            position:relative; width:640px; height:480px; 
            border: 2px solid #333; border-radius: 8px; overflow: hidden; 
            background: #000;
        }
        
        /* NO MIRRORING - Display as-is so landmarks align with visual */
        #video, #canvas { 
            position:absolute; top:0; left:0;
            width: 640px; height: 480px;
        }

        .ui-panel { 
            width: 640px; background: #1a1a1a; padding: 20px; 
            border-radius: 0 0 10px 10px; border: 1px solid #333; 
            text-align: center; margin-top: 10px; box-sizing: border-box;
        }
        
        #pred { font-size: 3.5em; font-weight: bold; color: #0f0; text-shadow: 0 0 15px #0f0; margin: 10px 0; }
        #status { color: #888; font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px; height: 1.2em; margin-bottom: 5px;}
        #info { color: #444; font-size: 0.7em; }
    </style>
</head>

<body>
    <h2>SignItUp: Alphabet & Numbers</h2>

    <div id="display-container">
        <div class="view-wrap">
            <video id="video" width="640" height="480" autoplay playsinline></video>
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>
    </div>

    <div class="ui-panel">
        <div id="status">System Initializing...</div>
        <div id="pred">---</div>
        <div id="info">Inference Engine: ONNX Runtime Web | Mode: Static Hand Pose</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const predEl = document.getElementById("pred");
        const statusEl = document.getElementById("status");

        let ortSession = null;
        let labelsDict = {};
        const CONFIDENCE_THRESHOLD = 0.75;

        // Create a temporary canvas for flipping frames before MediaPipe processing
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 640;
        tempCanvas.height = 480;
        const tempCtx = tempCanvas.getContext('2d');

        // 1. Load Model and Labels
        async function loadAssets() {
            try {
                const [lRes] = await Promise.all([
                    fetch(`./labels_static.json?v=${Date.now()}`)
                ]);
                labelsDict = await lRes.json();
                
                // Initialize ONNX
                ortSession = await ort.InferenceSession.create("./model_static.onnx");
                statusEl.innerText = "Ready - Place hand in view";
            } catch (e) {
                statusEl.innerText = "Error Loading Assets";
                console.error(e);
            }
        }

        // 2. Prediction Logic
        async function runInference(landmarks) {
            if (!ortSession) return;

            // Normalization (matching your Python logic)
            const xCoords = landmarks.map(l => l.x);
            const yCoords = landmarks.map(l => l.y);
            const minX = Math.min(...xCoords);
            const minY = Math.min(...yCoords);

            const inputData = new Float32Array(42);
            landmarks.forEach((lm, i) => {
                inputData[i * 2] = lm.x - minX;
                inputData[i * 2 + 1] = lm.y - minY;
            });

            const inputTensor = new ort.Tensor('float32', inputData, [1, 42]);

            try {
                // Fetch ONLY output index 0 to avoid the "non-tensor" error
                const labelOutputName = ortSession.outputNames[0];
                const results = await ortSession.run(
                    { [ortSession.inputNames[0]]: inputTensor },
                    [labelOutputName]
                );

                const predictedIdx = results[labelOutputName].data[0].toString();
                const char = labelsDict[predictedIdx];

                if (char) {
                    predEl.innerText = char;
                    statusEl.innerText = "SIGN DETECTED";
                }
            } catch (err) {
                console.warn("Inference slip:", err.message);
            }
        }

        // 3. MediaPipe Loop
        const hands = new Hands({ 
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` 
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.7
        });

        hands.onResults(res => {
            // Clear canvas
            ctx.clearRect(0, 0, 640, 480);

            if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                const hand = res.multiHandLandmarks[0];

                // Draw skeleton on the main view
                ctx.save();
                ctx.scale(-1, 1);
                ctx.translate(-640, 0);
                drawConnectors(ctx, hand, HAND_CONNECTIONS, {color: "#0f0", lineWidth: 2});
                drawLandmarks(ctx, hand, {color: "#fff", radius: 2});
                ctx.restore();

                runInference(hand);
            } else {
                predEl.innerText = "---";
                statusEl.innerText = "WAITING FOR HAND...";
            }
        });

        const camera = new Camera(video, { 
            onFrame: async () => { 
                // Flip the frame before sending to MediaPipe (matches Python cv2.flip)
                tempCtx.save();
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, -640, 0, 640, 480);
                tempCtx.restore();
                
                // Send the flipped frame to MediaPipe for processing
                await hands.send({image: tempCanvas});
            }, 
            width: 640, height: 480 
        });

        loadAssets().then(() => camera.start());
    </script>
</body>
</html>
